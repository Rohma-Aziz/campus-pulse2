{% extends "base.html" %}
{% block title %}Admin Dashboard{% endblock %}

{% block content %}
<section class="w-full max-w-md bg-white p-8 rounded-2xl shadow-lg border border-gray-100 text-center">
    <div class="w-16 h-16 bg-navy/10 text-navy rounded-full flex items-center justify-center text-2xl mx-auto mb-3">
        <i class="fa-solid fa-user-shield"></i>
    </div>
    <h2 class="text-2xl font-bold text-navy mb-1">Welcome, {{ session.get('user_name', 'Admin') }}!</h2>
    <p class="text-sm text-gray-500 mb-6">Manage complaints and departmental reports</p>

    <div class="space-y-3 text-sm">
        <a href="{{ url_for('manage_issues') }}" class="w-full py-3 bg-tealDark text-white font-semibold rounded-xl hover:bg-navy transition flex items-center justify-center">
            <i class="fa-solid fa-list-check mr-2"></i> View &amp; Manage Submissions
        </a>
        <a href="{{ url_for('analytics') }}" class="w-full py-3 bg-tealLight text-navy font-semibold rounded-xl hover:bg-tealDark hover:text-white transition flex items-center justify-center">
            <i class="fa-solid fa-chart-pie mr-2"></i> Analytics &amp; Reports
        </a>
        <a href="{{ url_for('feed') }}" class="w-full py-3 bg-navy text-white font-semibold rounded-xl hover:bg-tealDark transition flex items-center justify-center">
            <i class="fa-solid fa-comments mr-2 text-tealLight"></i> Community Feed
        </a>
        <a href="{{ url_for('logout') }}" class="w-full py-2.5 border text-gray-600 font-medium rounded-xl hover:bg-gray-100 transition flex items-center justify-center">
            Logout
        </a>
    </div>
</section>
{% endblock %}
