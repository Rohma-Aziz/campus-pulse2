{% extends "base.html" %}
{% block title %}Submit Feedback - CampusPulse{% endblock %}
{% block content %}
<div class="card p-4 mx-auto" style="border-top: 4px solid var(--secondary-teal);">
    <h4 class="mb-1" style="color: var(--primary-dark);">Submit Feedback</h4>
    <p class="text-muted small">Your rating helps the college see which facilities need attention.</p>
    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="mb-3">
            <label class="form-label fw-bold">Category</label>
            <select name="category" class="form-select" required>
                <option value="" disabled {{ 'selected' if not form.get('category') }}>Select category</option>
                {% for c in categories %}<option value="{{ c }}" {{ 'selected' if form.get('category') == c }}>{{ c }}</option>{% endfor %}
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label fw-bold">Issue title</label>
            <input name="title" class="form-control" maxlength="150" value="{{ form.get('title', '') }}" placeholder="e.g. Wi-Fi drops in hostel block B" required>
        </div>
        <div class="mb-3">
            <label class="form-label fw-bold">Description</label>
            <textarea name="description" class="form-control" rows="4" maxlength="2000" placeholder="Describe the issue or your feedback..." required>{{ form.get('description', '') }}</textarea>
        </div>
        <div class="mb-3">
            <label class="form-label fw-bold">Rating (1 = very poor, 5 = excellent)</label>
            <select name="rating" class="form-select" required>
                <option value="" disabled {{ 'selected' if not form.get('rating') }}>Select rating</option>
                {% for r in [5, 4, 3, 2, 1] %}<option value="{{ r }}" {{ 'selected' if form.get('rating') == r|string }}>{{ r }}</option>{% endfor %}
            </select>
        </div>
        <div class="form-check mb-2">
            <input class="form-check-input" type="checkbox" name="anonymous" id="anon" {{ 'checked' if form.get('anonymous') }}>
            <label class="form-check-label" for="anon">Submit anonymously (your name is hidden in the admin list)</label>
        </div>
        <p class="small text-muted">Department: <strong>{{ current_user.department or 'Not set' }}</strong> (taken from your profile)</p>
        <button class="btn btn-primary w-100 fw-bold">Submit Feedback</button>
    </form>
</div>
{% endblock %}
