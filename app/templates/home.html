{% extends "base.html" %}
{% block title %}Home{% endblock %}

{% block content %}
<section class="w-full max-w-lg text-center bg-white p-8 md:p-10 rounded-2xl shadow-lg border border-gray-100">
    <div class="w-20 h-20 bg-navy text-tealLight rounded-2xl mx-auto flex items-center justify-center text-3xl font-extrabold mb-4 shadow">
        CP
    </div>
    <h2 class="text-3xl font-bold text-navy mb-2">CampusPulse</h2>
    <p class="text-gray-600 text-sm mb-6">
        Student Feedback &amp; Campus Issue Analytics Platform
    </p>
    <div class="flex flex-col sm:flex-row gap-3">
        <a href="{{ url_for('signup') }}" class="w-full py-3 bg-tealDark text-white font-semibold rounded-xl hover:bg-navy transition">
            <i class="fa-solid fa-user-plus mr-1"></i> Sign Up
        </a>
        <a href="{{ url_for('login') }}" class="w-full py-3 bg-tealLight text-navy font-semibold rounded-xl hover:bg-tealDark hover:text-white transition">
            <i class="fa-solid fa-right-to-bracket mr-1"></i> Login
        </a>
    </div>
</section>
{% endblock %}
