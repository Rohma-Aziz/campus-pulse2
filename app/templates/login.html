{% extends "base.html" %}
{% block title %}Login - CampusPulse{% endblock %}
{% block content %}
<div class="card shadow-sm mx-auto" style="max-width: 440px;">
    <div class="card-body">
        <h4 class="mb-3">Login</h4>
        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="mb-3"><label class="form-label">Email</label>
                <input name="email" type="email" class="form-control" required></div>
            <div class="mb-3"><label class="form-label">Password</label>
                <input name="password" type="password" class="form-control" required></div>
            <button class="btn btn-primary w-100">Login</button>
        </form>
        <p class="small mt-3 mb-0">New student? <a href="{{ url_for('auth.signup') }}">Sign up</a></p>
    </div>
</div>
{% endblock %}
