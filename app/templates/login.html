{% extends "base.html" %}
{% block title %}Login{% endblock %}

{% block content %}
<section class="w-full max-w-md self-center bg-white p-6 rounded-2xl shadow-lg border border-gray-100">
    <h2 class="text-2xl font-bold text-navy text-center mb-1">Login</h2>
    <p class="text-sm text-gray-500 text-center mb-5">Enter your email &amp; password to access the system</p>

    <form method="POST" action="{{ url_for('auth.login') }}" class="space-y-4 text-sm">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        
        <div>
            <label for="email" class="block font-semibold text-navy mb-1">Email</label>
            <input type="email" id="email" name="email" required autofocus placeholder="you@college.edu"
                   class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-tealLight outline-none">
        </div>

        <div>
            <label for="password" class="block font-semibold text-navy mb-1">Password</label>
            <div class="relative">
                <input type="password" id="password" name="password" required placeholder="Enter password"
                       class="w-full p-2.5 pr-10 border rounded-lg focus:ring-2 focus:ring-tealLight outline-none">
                <button type="button" onclick="togglePassword('password', this)"
                        class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-navy" aria-label="Show or hide password">
                    <i class="fa-solid fa-eye"></i>
                </button>
            </div>
        </div>

        <!-- Role Selection Field Added Here -->
        <div>
            <label for="role" class="block font-semibold text-navy mb-1">Login As</label>
            <select id="role" name="role" required
                    class="w-full p-2.5 border rounded-lg bg-white focus:ring-2 focus:ring-tealLight outline-none">
                <option value="" disabled selected>Select role</option>
                <option value="student">Student</option>
                <option value="admin">Admin</option>
            </select>
        </div>

        <button type="submit" class="w-full py-3 bg-tealDark text-white font-bold rounded-xl hover:bg-navy transition">
            Login
        </button>
    </form>

    <p class="text-sm text-center text-gray-500 mt-4">
        New student? <a href="{{ url_for('auth.signup') }}" class="text-tealDark font-bold hover:underline">Sign up</a>
    </p>
</section>
{% endblock %}

{% block scripts %}
<script>
    function togglePassword(inputId, btn) {
        const input = document.getElementById(inputId);
        const icon = btn.querySelector('i');
        if (input.type === 'password') {
            input.type = 'text';
            icon.classList.replace('fa-eye', 'fa-eye-slash');
        } else {
            input.type = 'password';
            icon.classList.replace('fa-eye-slash', 'fa-eye');
        }
    }
</script>
{% endblock %}
