{% extends "base.html" %}
{% block title %}Sign Up - CampusPulse{% endblock %}
{% block content %}
<div class="card shadow-sm mx-auto" style="max-width: 440px;">
    <div class="card-body">
        <h4 class="mb-1">Create your account</h4>
        <p class="text-muted small">Students only. Admin accounts are created by the college.</p>
        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="mb-3"><label class="form-label">Name</label>
                <input name="name" class="form-control" maxlength="100" required></div>
            <div class="mb-3"><label class="form-label">Email</label>
                <input name="email" type="email" class="form-control" maxlength="120" required></div>
            <div class="mb-3"><label class="form-label">Password (8+ characters)</label>
                <input name="password" type="password" class="form-control" minlength="8" required></div>
            <div class="mb-3"><label class="form-label">Department</label>
                <select name="department" class="form-select" required>
                    <option value="" disabled selected>Select department</option>
                    {% for d in DEPARTMENTS %}<option>{{ d }}</option>{% endfor %}
                </select></div>
            <div class="mb-3"><label class="form-label">Year (optional)</label>
                <select name="year" class="form-select">
                    <option value="">Select year</option>
                    {% for y in [1,2,3,4] %}<option value="{{ y }}">{{ y }}</option>{% endfor %}
                </select></div>
            <button class="btn btn-primary w-100">Create Account</button>
        </form>
        <p class="small mt-3 mb-0">Already have an account? <a href="{{ url_for('auth.login') }}">Login</a></p>
    </div>
</div>
{% endblock %}
