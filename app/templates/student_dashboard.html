{% extends "base.html" %}

{% block title %}Student Dashboard{% endblock %}

{% block content %}
<section class="w-full max-w-md bg-white p-8 rounded-2xl shadow-lg border border-gray-100 text-center">
    <div class="w-16 h-16 bg-tealLight/20 text-tealDark rounded-full flex items-center justify-center mx-auto mb-4 text-2xl font-bold">
        <i class="fa-solid fa-user-graduate"></i>
    </div>
    
    <h2 class="text-2xl font-bold text-navy mb-1">Welcome, {{ current_user.name if current_user else 'Student' }}!</h2>
    <p class="text-sm text-gray-500 mb-6">College Feedback &amp; Community Portal</p>

    <div class="space-y-3 text-sm">
        <a href="{{ url_for('feedback.submit') }}" class="w-full py-3 bg-tealDark hover:bg-tealLight text-white rounded-xl font-medium transition block">
            <i class="fa-solid fa-pen-to-square mr-2"></i> Submit Feedback
        </a>
        <a href="{{ url_for('feedback.my_submissions') }}" class="w-full py-3 bg-tealDark hover:bg-tealLight text-white rounded-xl font-medium transition block">
            <i class="fa-solid fa-list-check mr-2"></i> View My Submissions
        </a>
        <a href="{{ url_for('feed.view_feed') }}" class="w-full py-3 bg-navy hover:bg-tealDark text-white font-semibold rounded-xl transition block">
            <i class="fa-solid fa-comments mr-2 text-tealLight"></i> Community Feed
        </a>
        <form method="POST" action="{{ url_for('auth.logout') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <button type="submit" class="w-full py-2.5 border border-gray-300 hover:bg-red-50 hover:text-red-600 text-gray-700 rounded-xl transition font-medium">
                Logout
            </button>
        </form>
    </div>
</section>
{% endblock %}
