{% extends "base.html" %}
{% block title %}Student Dashboard{% endblock %}

{% block content %}
<section class="w-full max-w-md bg-white p-8 rounded-2xl shadow-lg border border-gray-100 text-center">
    <div class="w-16 h-16 bg-tealLight/20 text-tealDark rounded-full flex items-center justify-center text-2xl mx-auto mb-3">
        <i class="fa-solid fa-user-graduate"></i>
    </div>
    <h2 class="text-2xl font-bold text-navy mb-1">Welcome, {{ session.get('user_name', 'Student') }}!</h2>
    <p class="text-sm text-gray-500 mb-6">College Feedback &amp; Issue Tracker</p>

    <div class="space-y-3 text-sm">
        <a href="{{ url_for('submit_feedback') }}" class="w-full py-3 bg-tealDark text-white font-semibold rounded-xl hover:bg-navy transition flex items-center justify-center">
            <i class="fa-solid fa-pen-to-square mr-2"></i> Submit Feedback
        </a>
        <a href="{{ url_for('my_submissions') }}" class="w-full py-3 bg-tealLight text-navy font-semibold rounded-xl hover:bg-tealDark hover:text-white transition flex items-center justify-center">
            <i class="fa-solid fa-list-check mr-2"></i> View My Submissions
        </a>
        <a href="{{ url_for('feed') }}" class="w-full py-3 bg-navy text-white font-semibold rounded-xl hover:bg-tealDark transition flex items-center justify-center">
            <i class="fa-solid fa-comments mr-2 text-tealLight"></i> Community Feed
        </a>
        <a href="{{ url_for('logout') }}" class="w-full py-2.5 border text-gray-600 font-medium rounded-xl hover:bg-gray-100 transition flex items-center justify-center">
            Logout
        </a>
    </div>
</section>
{% endblock %}
